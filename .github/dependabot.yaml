version: 2
updates:
  # Dependabot detects requirements*.in + requirements*.txt as pip-compile files
  # and regenerates the lock files together.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
